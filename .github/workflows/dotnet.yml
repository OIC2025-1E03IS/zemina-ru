name: .NET CI

on:
  push:
    branches: [ "master", "main", "feature/**" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ConsoleGuiApp.sln
      - name: Build
        run: dotnet build ConsoleGuiApp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/ConsoleGuiApp.Tests/ConsoleGuiApp.Tests.csproj --configuration Release --logger "console;verbosity=normal"
